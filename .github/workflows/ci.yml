name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://leaf_test@127.0.0.1:5432/leaf_test
      JWT_SECRET: ci-test-secret-only
      TEST_POSTGRES_BIN: /usr/lib/postgresql/16/bin
      PG_DUMP_PATH: /usr/lib/postgresql/16/bin/pg_dump
      VITE_API_URL: http://localhost:5000/api
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8
      - name: Install PostgreSQL test binaries
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-16 postgresql-client-16
          test -x "$TEST_POSTGRES_BIN/initdb"
      - run: bun install --frozen-lockfile
      - run: bun run prisma:generate
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
